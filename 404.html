<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="/assets/favicon.png" type="image/jpeg">
    <title>404 - Page Not Found | Custom Framing & Art Conservation Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* =========================
           THEME VARIABLES
        ========================= */
        :root,
        html[data-theme='light'] {
            --color-background: #F8F6F2;
            --color-primary-text: #2D2D2D;
            --color-secondary-text: #4A4A4A;
            --color-accent: #B08D57;
            --color-primary: #B08D57;
            --color-secondary: #2D2D2D;
            --color-border: #E0DCD3;
            --color-hover: #F0EBE1;
            --color-footer-bg: #2D2D2D;
            --color-footer-text: #F8F6F2;
            --color-card-bg: #FFFFFF;
        }

        html[data-theme='dark'] {
            --color-background: #121212;
            --color-primary-text: #EAEAEA;
            --color-secondary-text: #B3B3B3;
            --color-accent: #D4AF37;
            --color-primary: #D4AF37;
            --color-secondary: #EAEAEA;
            --color-border: #333333;
            --color-hover: #1A1A1A;
            --color-footer-bg: #0A0A0A;
            --color-footer-text: #EAEAEA;
            --color-card-bg: #1E1E1E;
        }

        html,
        body {
            background: var(--color-background);
            color: var(--color-primary-text);
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            transition: background-color 0.3s, color 0.3s;
            overflow-x: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        .text-primary-text { color: var(--color-primary-text); }
        .text-secondary-text { color: var(--color-secondary-text); }
        .text-accent { color: var(--color-accent); }
        .bg-hover { background-color: var(--color-hover); }
        .border-border { border-color: var(--color-border); }

        .btn-primary {
            background-color: var(--color-primary);
            color: var(--color-background);
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background-color: var(--color-accent);
            color: var(--color-background);
            box-shadow: 0 0 20px rgba(192, 57, 43, 0.4);
        }

        .particle-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background-color: var(--color-accent);
            border-radius: 50%;
            opacity: 0.15;
            animation: floatParticle 12s infinite ease-in-out;
        }

        @keyframes floatParticle {
            0%, 100% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-20px) translateX(10px); }
        }
    </style>
</head>

<body class="antialiased h-screen flex items-center justify-center">
    <section class="relative w-full h-full flex items-center justify-center overflow-hidden">
        <!-- Smooth Animated Particle Anchor Point -->
        <div id="particles" class="particle-bg"></div>
        
        <div class="container mx-auto px-6 relative z-10 text-center max-w-3xl">
            <h1 class="text-8xl sm:text-[10rem] font-serif font-semibold text-accent tracking-tighter mb-4 leading-none">
                404
            </h1>
            <h2 class="text-3xl sm:text-3xl sm:text-5xl font-serif font-semibold text-primary-text mb-6">
                Page Not Found
            </h2>
            <p class="text-base sm:text-lg text-secondary-text max-w-lg mx-auto mb-10 leading-relaxed">
                The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
            </p>
            <div class="flex justify-center">
                <a href="index.html" class="btn-primary font-semibold px-8 py-4 rounded-xl shadow-md flex items-center gap-3 transition-all">
                    <i class="fa-solid fa-arrow-left text-base"></i> Return to Homepage
                </a>
            </div>
        </div>
    </section>

    <script>
        // Simple particle generation
        const particlesContainer = document.getElementById('particles');
        const particleCount = 15;
        
        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            // Random properties
            const size = Math.random() * 60 + 20; // 20px to 80px
            const posX = Math.random() * 100;
            const posY = Math.random() * 100;
            const delay = Math.random() * 5;
            const duration = Math.random() * 10 + 10;
            
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${posX}%`;
            particle.style.top = `${posY}%`;
            particle.style.animationDelay = `${delay}s`;
            particle.style.animationDuration = `${duration}s`;
            
            particlesContainer.appendChild(particle);
        }
    </script>
</body>

</html>
